name: Validate repository

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Validate catalogs and lock files
        run: |
          python scripts/validate_catalog.py
          python -m json.tool catalog/longform-tools.json >/dev/null
          python -m json.tool tools/web-media-stack.lock.json >/dev/null
          python -m json.tool tools/longform-stack.lock.json >/dev/null

      - name: Materialize compressed workflows
        run: python scripts/materialize_workflows.py

      - name: Validate ComfyUI workflows
        run: python scripts/validate_workflows.py

      - name: Compile Python scripts and skill helpers
        run: |
          python -m py_compile scripts/*.py
          python -m py_compile skills/moneyprinterturbo-video/mpt_agent.py

      - name: Dry-run pinned installers
        run: |
          python scripts/install_web_media_stack.py --profile full --dry-run
          python scripts/configure_web_media_apps.py --app all --dry-run
          python scripts/install_longform_stack.py --dry-run

      - name: Smoke-test command interfaces
        run: |
          python scripts/search_open_media.py --help >/dev/null
          python scripts/ingest_authorized_source.py --help >/dev/null
          python scripts/media_asset_manifest.py --help >/dev/null
          python scripts/configure_web_media_apps.py --help >/dev/null
          python scripts/scaffold_longform_project.py --help >/dev/null
          python scripts/ingest_longform_corpus.py --help >/dev/null
          python scripts/longform_pipeline.py --help >/dev/null
          python scripts/build_longform_asset_plan.py --help >/dev/null
          python scripts/render_longform_narration.py --help >/dev/null
          python scripts/build_longform_timeline.py --help >/dev/null
          python scripts/render_longform_chapters.py --help >/dev/null
          python scripts/assemble_longform_video.py --help >/dev/null
          python scripts/longform_preflight.py --help >/dev/null
          python scripts/run_longform_project.py --help >/dev/null

      - name: Smoke-test video generation project scaffolder
        run: |
          python scripts/scaffold_project.py \
            --name "ci-smoke-test" \
            --output "$RUNNER_TEMP/ai-video-creation-test" \
            --duration 7 \
            --shot-length 3 \
            --aspect-ratio 16:9 \
            --fps 24 \
            --mode mixed
          test -f "$RUNNER_TEMP/ai-video-creation-test/ci-smoke-test/brief.md"
          test -f "$RUNNER_TEMP/ai-video-creation-test/ci-smoke-test/manifest.json"
          test -f "$RUNNER_TEMP/ai-video-creation-test/ci-smoke-test/prompts.md"
          test -f "$RUNNER_TEMP/ai-video-creation-test/ci-smoke-test/shots.csv"
          python -m json.tool "$RUNNER_TEMP/ai-video-creation-test/ci-smoke-test/manifest.json" >/dev/null

      - name: Smoke-test research-to-video project and rights gate
        run: |
          python scripts/scaffold_web_media_project.py \
            --name "ci-web-media-test" \
            --topic "Traceable research to video" \
            --output "$RUNNER_TEMP/web-media-test" \
            --duration 30 \
            --aspect-ratio 9:16 \
            --language zh-CN
          PROJECT="$RUNNER_TEMP/web-media-test/ci-web-media-test"
          test -f "$PROJECT/brief.md"
          test -f "$PROJECT/project.json"
          test -f "$PROJECT/script/script.md"
          test -f "$PROJECT/storyboard/storyboard.csv"
          test -f "$PROJECT/edit/edit-plan.json"
          test -f "$PROJECT/manifests/assets.jsonl"
          python -m json.tool "$PROJECT/project.json" >/dev/null
          python -m json.tool "$PROJECT/edit/edit-plan.json" >/dev/null
          printf 'ci-owned-image' > "$PROJECT/assets/images/user-owned.jpg"
          python scripts/media_asset_manifest.py add \
            --manifest "$PROJECT/manifests/assets.jsonl" \
            --id "user-owned-001" \
            --kind image \
            --local-path "assets/images/user-owned.jpg" \
            --license "User-owned" \
            --rights-status user-owned \
            --permission-note "CI fixture created by this workflow" \
            --selected
          python scripts/media_asset_manifest.py validate \
            --manifest "$PROJECT/manifests/assets.jsonl"

      - name: Smoke-test long-form project, corpus, and asset approval
        run: |
          python scripts/scaffold_longform_project.py \
            --name "ci-longform-test" \
            --topic "Long-form traceable production" \
            --output "$RUNNER_TEMP/longform-test" \
            --duration 65 \
            --chapter-minutes 7 \
            --aspect-ratio 16:9 \
            --language zh-CN
          PROJECT="$RUNNER_TEMP/longform-test/ci-longform-test"
          test -f "$PROJECT/project.json"
          test -f "$PROJECT/state/pipeline.json"
          test -f "$PROJECT/chapters/01/status.json"
          test -f "$PROJECT/outline/chapter-map.csv"
          python -m json.tool "$PROJECT/project.json" >/dev/null
          printf '第一段研究资料。\n\n第二段包含可核查事实和背景。\n' > "$PROJECT/research/inbox/source.txt"
          python scripts/ingest_longform_corpus.py \
            --project "$PROJECT"
          test -s "$PROJECT/research/sources.jsonl"
          test -s "$PROJECT/research/chunks.jsonl"
          test -f "$PROJECT/research/index.sqlite"
          python scripts/longform_pipeline.py \
            --project "$PROJECT" \
            status
          printf 'candidate-image' > "$PROJECT/assets/global/images/candidate.jpg"
          python scripts/media_asset_manifest.py add \
            --manifest "$PROJECT/manifests/assets.jsonl" \
            --id "candidate-001" \
            --kind image \
            --local-path "assets/global/images/candidate.jpg" \
            --license "User-owned" \
            --rights-status user-owned \
            --permission-note "CI fixture created by this workflow"
          python scripts/media_asset_manifest.py set-selected \
            --manifest "$PROJECT/manifests/assets.jsonl" \
            --id "candidate-001" \
            --value true \
            --note "CI approval test"
          python scripts/media_asset_manifest.py validate \
            --manifest "$PROJECT/manifests/assets.jsonl"
          python scripts/media_asset_manifest.py set-selected \
            --manifest "$PROJECT/manifests/assets.jsonl" \
            --id "candidate-001" \
            --value false \
            --note "CI unapproval test"
